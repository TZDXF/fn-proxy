name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm run test:rust
      - run: npm run rust:check
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Publish verified installer and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -eq 0) { throw "No NSIS installer was produced" }
          # GitHub replaces spaces in asset names with dots. Normalize before hashing.
          $assetDirectory = Join-Path $env:RUNNER_TEMP "fn-proxy-release"
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          $installers = @($installers | ForEach-Object {
            $assetPath = Join-Path $assetDirectory ($_.Name -replace '[^A-Za-z0-9._-]', '.')
            Copy-Item -LiteralPath $_.FullName -Destination $assetPath -PassThru
          })
          $checksums = @($installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          })
          $checksumPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $checksums | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM
          $existing = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne "true") { throw "Release already published; refusing to overwrite it" }
          } else {
            $notes = "docs/releases/$($env:RELEASE_TAG).md"
            if (Test-Path -LiteralPath $notes) {
              gh release create $env:RELEASE_TAG --verify-tag --draft --title "FN Proxy $env:RELEASE_TAG" --notes-file $notes
            } else {
              gh release create $env:RELEASE_TAG --verify-tag --draft --title "FN Proxy $env:RELEASE_TAG" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release draft" }
          }
          $assets = @($installers | ForEach-Object { $_.FullName }) + @($checksumPath)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets; draft preserved" }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release; draft preserved" }
